<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주식 물타기 계산기 | 평균단가 계산</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172235;font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif}.wrap{max-width:620px;margin:35px auto;padding:22px}.panel{background:white;border-radius:20px;padding:25px;box-shadow:0 8px 32px #142a4912}h1{font-size:26px;margin:0 0 9px}p{color:#667085;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:25px}label{font-size:14px;font-weight:700;display:block;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:10px;font-size:17px}button{border:0;background:#175cd3;color:white;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:20px}.results{margin-top:22px;padding:19px;background:#edf4ff;border-radius:14px}.metric{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #d9e5f7}.metric:last-child{border:0}.metric strong{font-size:19px;text-align:right}.hint{font-size:13px;margin-top:18px}.error{color:#b42318;font-size:14px;min-height:20px;margin-top:10px}@media(max-width:440px){.grid{grid-template-columns:1fr}.wrap{margin:0;padding:12px}.panel{padding:20px}}</style></head><body><main class="wrap"><section class="panel"><h1>📈 주식 물타기 계산기</h1><p>현재 보유 수량과 추가 매수 계획을 입력하면 새로운 평균단가를 계산해 드립니다.</p><div class="grid"><div><label for="oldPrice">기존 평균 매수가 (원)</label><input id="oldPrice" type="number" min="0" step="any" value="50000" inputmode="decimal"></div><div><label for="oldQty">기존 보유 수량 (주)</label><input id="oldQty" type="number" min="0" step="1" value="100" inputmode="numeric"></div><div><label for="newPrice">추가 매수가 (원)</label><input id="newPrice" type="number" min="0" step="any" value="35000" inputmode="decimal"></div><div><label for="newQty">추가 매수 수량 (주)</label><input id="newQty" type="number" min="0" step="1" value="50" inputmode="numeric"></div></div><button id="calc">새 평균단가 계산하기</button><div id="error" class="error" role="alert"></div><div class="results" aria-live="polite"><div class="metric"><span>새 평균단가</span><strong id="avg">-</strong></div><div class="metric"><span>전체 보유 수량</span><strong id="qty">-</strong></div><div class="metric"><span>총 매수금액</span><strong id="total">-</strong></div><div class="metric"><span>추가 매수금액</span><strong id="additional">-</strong></div><div class="metric"><span>기존 대비 평균단가 변화</span><strong id="change">-</strong></div></div><p class="hint">계산식: (기존 평균단가 × 기존 수량 + 추가 매수가 × 추가 수량) ÷ 전체 수량. 거래 수수료·세금은 제외되며, 물타기는 손실 위험을 줄여주지 않습니다.</p></section></main><script>const fmt=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:2}).format(n);function calculate(){const op=Number(document.getElementById('oldPrice').value),oq=Number(document.getElementById('oldQty').value),np=Number(document.getElementById('newPrice').value),nq=Number(document.getElementById('newQty').value);const vals=[op,oq,np,nq];const err=document.getElementById('error');if(vals.some(v=>!Number.isFinite(v)||v<0)||!Number.isInteger(oq)||!Number.isInteger(nq)||oq+nq===0){err.textContent='금액은 0 이상, 수량은 0 이상의 정수로 입력하고 전체 수량은 1주 이상이어야 합니다.';return}if((oq>0&&op<=0)||(nq>0&&np<=0)){err.textContent='보유 또는 매수 수량이 있다면 해당 매수가는 0보다 커야 합니다.';return}err.textContent='';const total=op*oq+np*nq,avg=total/(oq+nq);document.getElementById('avg').textContent=fmt(avg)+'원';document.getElementById('qty').textContent=fmt(oq+nq)+'주';document.getElementById('total').textContent=fmt(total)+'원';document.getElementById('additional').textContent=fmt(np*nq)+'원';document.getElementById('change').textContent=oq>0?fmt((avg/op-1)*100)+'%':'비교 대상 없음'}document.getElementById('calc').addEventListener('click',calculate);calculate();</script></body></html>
